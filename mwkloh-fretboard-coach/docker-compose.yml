services:
  app_proxy:
    environment:
      APP_HOST: mwkloh-fretboard-coach_web_1
      APP_PORT: 3000
  web:
    image: ghcr.io/mwkloh/fretboard-coach:0.7.0
    user: "1000:1000"
    init: true
    restart: on-failure
    environment:
      DATA_DIR: /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
