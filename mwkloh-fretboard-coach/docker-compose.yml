services:
  app_proxy:
    environment:
      APP_HOST: mwkloh-fretboard-coach_web_1
      APP_PORT: 3000
  web:
    image: ghcr.io/mwkloh/fretboard-coach:0.8.0@sha256:ed256e129b9453dfabb8a75d3504425f995e96e1236f1c4c5704aee147a845ab
    user: "1000:1000"
    init: true
    restart: on-failure
    environment:
      DATA_DIR: /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
