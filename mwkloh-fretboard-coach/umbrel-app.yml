tagline: Learn the fretboard on the way to lead guitar
icon: https://raw.githubusercontent.com/mwkloh/umbrel-app-store/main/mwkloh-fretboard-coach/icon.svg
description: >-
  Fretboard Coach shows the guitar neck with every note's job, plays backing so you can hear
  which notes land and which pass, and follows a 10-stage path toward confident lead playing.

  Your progress is stored on this Umbrel. You can download a backup of it from Settings.
releaseNotes: "Stage 6 is in the app: lessons 6.1–6.5 are full pages, the Explorer plays a 12-bar and a slow blues with the bar number and an End button, shows the blues scale, the metronome clicks triplets, and the Lick player has turnaround and ending licks."
